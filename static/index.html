<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12261b">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Predictor">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Sports Predictor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=10">
<script src="/common.js?v=10"></script>
</head>
<body>
<main>
  <div id="nav"></div>
  <div class="hello">
    <div><h1 id="hello-title">This week</h1><p id="hello-sub">NFL predictions, updated live.</p></div>
    <div class="status"><span class="dot" id="dot"></span><span id="status-text">Connecting</span></div>
  </div>

  <section id="yt-wrap">
    <div class="sec-head"><div><h2>Your teams</h2></div><button id="notify-btn" hidden>Turn on notifications</button></div>
    <div class="yt" id="yt"></div>
  </section>

  <section>
    <div class="sec-head"><div><h2>Games</h2><p>Each team's chance to win, live during games.</p></div>
      <button class="linkbtn" id="sim-open">Simulate a matchup</button></div>
    <div class="simbar" id="simbar" hidden>
      <select id="sim-away" aria-label="Away team"></select><span class="at">at</span><select id="sim-home" aria-label="Home team"></select>
      <button class="primary" id="sim-go">Start</button><button id="sim-close">Cancel</button>
    </div>
    <div class="board" id="board"></div>
  </section>

  <section>
    <div class="sec-head"><div><h2 id="picks-title">This week's picks</h2></div></div>
    <p class="factline" id="factline" hidden><b>Did you know</b><span id="fact"></span></p>
    <div class="picks" id="picks"></div>
  </section>

  <footer><a href="/how.html">How the model works</a> &nbsp; <a href="/tracker.html">Model accuracy</a></footer>
</main>

<script>
$("#nav").innerHTML = navHTML("Today");

/* ---------- your teams ---------- */
async function loadYourTeams(){
  const fav = Fav.get();
  $("#notify-btn").hidden = !fav.length;
  const on = localStorage.getItem("notify") === "on" && window.Notification && Notification.permission === "granted";
  $("#notify-btn").textContent = on ? "Notifications on" : "Turn on notifications";
  $("#notify-btn").className = on ? "" : "primary";
  if (!fav.length){
    $("#yt").innerHTML = `<div class="empty" style="padding:16px">Tap the ☆ next to any team (on Teams or Standings) to follow it here, with its news and alerts.</div>`;
    return;
  }
  const [d, news] = await Promise.all([getJSON(`/api/favorites?teams=${fav.join(",")}`),
    getJSON(`/api/news?teams=${fav.join(",")}`).catch(() => ({mine: [], headlines: []}))]);
  const stories = [...news.mine, ...news.headlines];
  $("#yt").innerHTML = d.map(t => {
    const s = stories.find(x => (x.teams || []).includes(t.team));
    return `<div class="ytc"><h3>${starBtn(t.team)}<a href="/team.html?t=${t.team}">${esc(t.name)}</a></h3>
      ${t.live ? `<p class="livebox">Live: ${t.team} ${t.live.us}, ${t.next ? t.next.opp : ""} ${t.live.them}. ${esc(t.live.detail)}. Win chance ${pct(t.live.win_prob)}</p>` : ""}
      <div class="rows"><span>Record</span><span>${t.record}</span>
      ${t.next ? `<span>Next</span><span>${t.next.home ? "vs." : "at"} ${teamLink(t.next.opp)}, ${pct(t.next.win_prob)} to win</span>` : ""}
      ${t.outlook ? `<span>Playoffs</span><span>${pct(t.outlook.playoffs)} chance</span>` : ""}</div>
      ${s ? `<p class="headline"><a href="${/^https?:\/\//.test(s.url) ? s.url : "#"}" target="_blank" rel="noopener">${esc(s.title)}</a><span>${esc(s.source || "Saved story")}</span></p>` : ""}
    </div>`;
  }).join("");
}
$("#notify-btn").onclick = async () => {
  if (localStorage.getItem("notify") === "on" && Notification.permission === "granted"){ Notify.disable(); toast("Notifications off."); }
  else await Notify.enable();
  loadYourTeams();
};
document.addEventListener("favchange", () => { loadYourTeams(); renderBoard(); });

/* ---------- live win probability (same math as live.py) ---------- */
function erf(x){const s=Math.sign(x);x=Math.abs(x);const t=1/(1+.3275911*x);
  return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x));}
const cdf = z => .5*(1+erf(z/Math.SQRT2));
function invCdf(p){let lo=-8,hi=8;for(let i=0;i<60;i++){const m=(lo+hi)/2;cdf(m)<p?lo=m:hi=m;}return (lo+hi)/2;}
function liveProb(pre, margin, minsLeft){
  const f = Math.max(minsLeft,0)/60;
  if (f < .0005) return margin>0?1:margin<0?0:.5;
  return cdf((margin + 13.5*invCdf(Math.min(Math.max(pre,.001),.999))*f) / (13.5*Math.sqrt(f)));
}

/* ---------- game board ---------- */
let serverGames = [], simGame = null, liveError = null, TEAMS = [];
function spark(hist){
  const W=300,H=64;
  if (!hist || hist.length < 2) return "";
  const pts = hist.map(([m,p]) => `${((60-m)/60*W).toFixed(1)},${((1-p)*H).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Home win probability over the game">
    <line x1="0" y1="${H/2}" x2="${W}" y2="${H/2}" stroke="rgba(238,240,230,.25)" stroke-dasharray="4 4"/>
    ${[1,2,3].map(q=>`<line x1="${W*q/4}" y1="0" x2="${W*q/4}" y2="${H}" stroke="rgba(238,240,230,.08)"/>`).join("")}
    <polyline points="${pts}" fill="none" stroke="${css('--pylon')}" stroke-width="2.2" vector-effect="non-scaling-stroke"/></svg>`;
}
function gameCard(g){
  const hp = g.live_home_prob ?? g.pregame_home_prob ?? .5, live = g.state === "in";
  const fav = hp >= .5 ? g.home.abbr : g.away.abbr;
  let foot;
  if (g.state === "pre") foot = `Model favors ${fav} at ${pct(Math.max(hp,1-hp))} before kickoff`;
  else if (live) foot = `Pregame ${pct(g.pregame_home_prob)} for ${g.home.abbr}, now ${pct(hp)}`;
  else { const pf = g.pregame_home_prob >= .5 ? g.home.abbr : g.away.abbr, w = g.home.score > g.away.score ? g.home.abbr : g.away.abbr;
    foot = g.sim ? `Final. ${w} wins the simulation.` : pf === w ? `Model picked ${pf} and was right` : `Model picked ${pf}; ${w} won`; }
  const team = (t, side, p) => `<div class="row ${side}">
    <div><span class="abbr ${g.possession===t.abbr?'poss':''}">${t.abbr}</span><span class="nm">${esc(t.name)}${t.record?` (${t.record})`:""}</span></div>
    <div class="sc">${g.state==="pre"?"":t.score}</div><div class="pc">${pct(p)}</div></div>`;
  const favd = [g.home.abbr, g.away.abbr].some(t => Fav.has(t));
  const ctl = g.sim ? `<div class="simctl">${g.state === "post"
      ? `<button data-sim="again">Run again</button><button data-sim="discard">Discard</button>`
      : `<button data-sim="pause">${simPaused ? "Resume" : "Pause"}</button><button data-sim="speed">${simFast ? "Normal speed" : "Faster"}</button><button data-sim="discard">Discard</button>`}</div>` : "";
  return `<article class="game ${live?'live':''} ${favd && !g.sim?'fav-game':''} ${g.sim?'sim':''}">
    <div class="game-top"><span class="state">${g.sim?"Simulation: ":""}${g.detail}</span><span>${g.down||""}${g.red_zone?" in the red zone":""}</span></div>
    ${team(g.away,"away",1-hp)}${team(g.home,"home",hp)}
    <div class="field" aria-label="${g.home.abbr} ${pct(hp)} to win"><div class="home-fill" style="width:${hp*100}%"></div><div class="mid"></div></div>
    ${spark(g.history)}<p class="game-foot">${foot}</p>${ctl}</article>`;
}
function renderBoard(){
  const order = {in:0,pre:1,post:2};
  const favd = g => [g.home.abbr, g.away.abbr].some(t => Fav.has(t)) ? 0 : 1;
  const games = [...(simGame?[simGame]:[]), ...serverGames.slice().sort((a,b)=>order[a.state]-order[b.state] || favd(a)-favd(b))];
  $("#board").innerHTML = games.length ? games.map(gameCard).join("") :
    `<div class="empty"><p>${liveError ? "Live scores are unavailable right now." : "No games on the scoreboard right now."}</p>
     <button class="primary" onclick="openSim()">Simulate a matchup</button></div>`;
}
async function loadLive(){
  try{
    const d = await getJSON("/api/live");
    serverGames = d.games || []; liveError = d.error;
    const anyLive = serverGames.some(g=>g.state==="in");
    $("#dot").className = "dot " + (d.error ? "err" : anyLive ? "on" : "");
    $("#status-text").textContent = d.error ? "Live scores unavailable" : anyLive ? `Live, updated ${ago(d.updated)}` : `Scores checked ${ago(d.updated)}`;
  }catch(e){ $("#dot").className="dot err"; $("#status-text").textContent="Can't reach the server"; }
  renderBoard();
}

/* ---------- simulator: pick two real teams, pause or discard any time ---------- */
let simTimer = null, simPaused = false, simFast = false, simPre = .5, simMins = 60;
async function openSim(){
  if (!TEAMS.length){ const d = await getJSON("/api/teams"); TEAMS = d.teams.slice().sort((a,b)=>a.team.localeCompare(b.team)); }
  const opts = sel => TEAMS.map(t => `<option value="${t.team}" ${t.team===sel?"selected":""}>${t.team}</option>`).join("");
  let away = "SF", home = "KC";
  const fav = Fav.get()[0];
  try {
    if (fav){ const f = (await getJSON(`/api/favorites?teams=${fav}`))[0]; if (f && f.next){ [away, home] = f.next.home ? [f.next.opp, fav] : [fav, f.next.opp]; } }
    else { const p = await getJSON("/api/predictions"); const g = p.games.find(x => !x.completed); if (g){ away = g.away; home = g.home; } }
  } catch(e){}
  $("#sim-away").innerHTML = opts(away); $("#sim-home").innerHTML = opts(home);
  $("#simbar").hidden = false; $("#sim-away").focus();
}
$("#sim-open").onclick = openSim;
$("#sim-close").onclick = () => { $("#simbar").hidden = true; };
$("#sim-go").onclick = async () => {
  const a = $("#sim-away").value, h = $("#sim-home").value;
  if (a === h){ toast("Pick two different teams."); return; }
  try { simPre = (await getJSON(`/api/matchup-prob?home=${h}&away=${a}`)).home_prob; } catch(e){ simPre = .55; }
  const name = t => (TEAMS.find(x => x.team === t) || {}).name || t;
  $("#simbar").hidden = true;
  startSim(a, h, name(a).split(" ").pop(), name(h).split(" ").pop());
};
function startSim(a, h, an, hn){
  clearInterval(simTimer); simPaused = false; simMins = 60;
  simGame = {sim:true, id:"sim", state:"in", detail:"15:00 - 1st", pregame_home_prob:simPre, live_home_prob:simPre,
    home:{abbr:h, name:hn, score:0}, away:{abbr:a, name:an, score:0}, history:[[60, simPre]]};
  runSim(); renderBoard();
  document.getElementById("board").scrollIntoView({behavior: "smooth", block: "start"});
}
function runSim(){
  clearInterval(simTimer);
  simTimer = setInterval(simTick, simFast ? 250 : 900);
}
function simTick(){
  if (simPaused || !simGame) return;
  simMins = Math.max(0, simMins - (0.6 + Math.random()*1.4));
  if (Math.random() < .16){ const home = Math.random() < .5 + (simPre-.5)*.8; (home?simGame.home:simGame.away).score += Math.random()<.62?7:3; }
  let margin = simGame.home.score - simGame.away.score;
  const period = Math.min(4, Math.floor((60-simMins)/15)+1), inQ = simMins - (4-period)*15;
  const mm = Math.floor(inQ), ss = String(Math.round((inQ-mm)*60)).padStart(2,"0");
  simGame.detail = simMins<=0 ? "Final" : `${mm}:${ss} - ${["1st","2nd","3rd","4th"][period-1]}`;
  if (simMins<=0 && margin===0){ (Math.random() < simPre ? simGame.home : simGame.away).score += 3; margin = simGame.home.score - simGame.away.score; simGame.detail="Final/OT"; }
  simGame.live_home_prob = liveProb(simPre, margin, simMins);
  simGame.history.push([simMins, simGame.live_home_prob]);
  if (simMins<=0){ simGame.state="post"; clearInterval(simTimer); }
  renderBoard();
}
$("#board").addEventListener("click", e => {
  const b = e.target.closest("[data-sim]"); if (!b || !simGame) return;
  const act = b.dataset.sim;
  if (act === "discard"){ clearInterval(simTimer); simGame = null; renderBoard(); }
  else if (act === "pause"){ simPaused = !simPaused; renderBoard(); }
  else if (act === "speed"){ simFast = !simFast; runSim(); renderBoard(); }
  else if (act === "again"){ startSim(simGame.away.abbr, simGame.home.abbr, simGame.away.name, simGame.home.name); }
});

/* ---------- picks ---------- */
async function loadPicks(){
  const d = await getJSON("/api/predictions");
  $("#hello-title").textContent = `Week ${d.week}`;
  $("#hello-sub").textContent = `${d.season} NFL season. ${d.games.filter(g=>!g.completed).length} games left to play this week.`;
  $("#picks-title").textContent = `Week ${d.week} picks`;
  $("#picks").innerHTML = d.games.map(g => {
    const conf = Math.max(g.model_home_prob, 1 - g.model_home_prob);
    let res = `<span class="muted">Not played</span>`;
    if (g.completed){
      const v = g.correct===null ? `<span class="muted">Tie</span>` : `<span class="${g.correct?'ok':'no'}">${g.correct?"Right":"Wrong"}</span>`;
      res = `${v} ${g.away} ${g.away_score}, ${g.home} ${g.home_score}`;
    }
    return `<details class="pick"><summary>
        <span class="mu">${g.away} at ${g.home}</span>
        <span><span class="lbl">Model pick</span><strong>${g.pick}</strong> ${pct(conf)}</span>
        <span class="hide-sm"><span class="lbl">Elo only</span>${g.home} ${pct(g.elo_home_prob)}</span>
        <span class="hide-sm">${res}</span></summary>
      <div class="body">
        <div><h3 style="margin-bottom:8px">Why ${g.pick}</h3>${factorsHTML(g)}
          <h3 style="margin:16px 0 8px">Matchup keys</h3>${keysHTML(g.keys)}</div>
        <div><h3 style="margin-bottom:8px">${teamLink(g.away)} injuries</h3>${injuriesHTML(g.away_injuries)}</div>
        <div><h3 style="margin-bottom:8px">${teamLink(g.home)} injuries</h3>${injuriesHTML(g.home_injuries)}</div>
      </div></details>`;
  }).join("");
}

/* ---------- one rotating stat line ---------- */
let facts = [], fi = 0;
async function loadFacts(){ facts = (await getJSON("/api/stats")).facts; fi = 0; showFact(); $("#factline").hidden = !facts.length; }
function showFact(){ if (facts.length){ $("#fact").textContent = facts[fi % facts.length]; fi++; } }
setInterval(showFact, 12000);

loadLive(); loadYourTeams(); loadPicks(); loadFacts();
setInterval(loadLive, 20000); setInterval(loadYourTeams, 60000); setInterval(() => { loadPicks(); loadFacts(); }, 5*60*1000);
</script>
</body>
</html>
