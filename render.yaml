services:
  - type: web
    name: sports-predictor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MALLOC_ARENA_MAX     # keeps memory use well under the free plan's limit
        value: "2"
      - key: ANTHROPIC_API_KEY    # optional: turns on Ask. Set a monthly spend limit in the Anthropic Console.
        sync: false
